version: '3.8'
services:
  mongo:
    image: mongo:6.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27018:27017"

  redis:
    image: redis:7.0
    restart: unless-stopped
    ports:
      - "6380:6379"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
      - redis
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB=rca
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./:/app:ro
    # By default the service prints help and exits; run with `docker-compose run app INC-000001 --bootstrap` to execute
    command: ["--help"]

volumes:
  mongo-data:
