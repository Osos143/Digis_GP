[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ran-anomaly-service"
version = "1.0.0"
description = "CLI service for the LTE drive-test throughput anomaly-detection / RCA-handoff pipeline"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "plotly",
    "ipython",
    "pyarrow",
    "scikit-learn",
    "threadpoolctl",
    "joblib",
    "pymongo",
]

[project.optional-dependencies]
lstm = ["torch"]

[project.scripts]
ran-anomaly = "ran_anomaly.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ran_anomaly = ["stages/*.py"]
